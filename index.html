<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NSU Result Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow: hidden;

            background:
                linear-gradient(
                    rgba(5, 30, 55, 0.78),
                    rgba(5, 30, 55, 0.78)
                ),
                url("bg-nsu.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(
                circle at center,
                transparent 0%,
                rgba(0, 0, 0, 0.25) 100%
            );
            pointer-events: none;
        }

        /* Main card */
        .welcome-card {
            position: relative;
            width: min(90%, 650px);
            padding: 55px 45px;
            text-align: center;

            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);

            animation: cardAppear 1.2s ease;
        }

        /* Logo */
        .logo {
            width: 115px;
            height: 115px;
            object-fit: contain;

            background: white;
            padding: 12px;
            border-radius: 50%;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

            margin-bottom: 25px;

            animation: logoAppear 1.4s ease;
        }

        .university {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;

            margin-bottom: 12px;
        }

        h1 {
            color: white;
            font-size: clamp(32px, 6vw, 52px);
            line-height: 1.1;

            margin-bottom: 18px;

            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.88);
            font-size: 17px;
            line-height: 1.7;

            max-width: 480px;
            margin: 0 auto 32px;
        }

        /* Button */
        .enter-button {
            display: inline-block;

            padding: 15px 38px;

            border-radius: 50px;
            border: none;

            background: white;
            color: #073b66;

            font-size: 16px;
            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .enter-button:hover {
            transform: translateY(-4px);

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);

            background: #f1f7ff;
        }

        .enter-button:active {
            transform: translateY(-1px);
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 22px;

            width: 100%;

            text-align: center;

            color: rgba(255, 255, 255, 0.65);

            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* Animations */
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes logoAppear {
            from {
                opacity: 0;
                transform: scale(0.6);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }

            .welcome-card {
                padding: 40px 25px;
                border-radius: 22px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }

            .university {
                font-size: 14px;
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 15px;
            }

            .footer {
                position: fixed;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="welcome-card">

        <!-- NSU Logo -->
        <img
            class="logo"
            src="nsu-org.jpeg"
            alt=""
        >

        <div class="university">
            North South University
        </div>

        <h1>
            Result Portal
        </h1>

        <p class="subtitle">
            Welcome to your personal NSU semester result portal.
            Access your academic information through a secure and
            simple interface.
        </p>

        <a href="login.html" class="enter-button"></a>
            Enter Portal
        </a>

    </main>

    <div class="footer">
        Personal Academic Portal • North South University
    </div>

</body>
</html>
