<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSU Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(5, 30, 55, 0.78),
                    rgba(5, 30, 55, 0.78)
                ),
                url("bg-nsu.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: min(90%, 430px);
            padding: 45px 35px;

            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);

            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;

            background: white;
            padding: 10px;
            border-radius: 50%;

            margin-bottom: 20px;
        }

        h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;

            border: none;
            outline: none;
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.92);

            font-size: 15px;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25);
        }

        .login-button {
            width: 100%;
            padding: 14px;

            margin-top: 10px;

            border: none;
            border-radius: 50px;

            background: white;
            color: #073b66;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .error {
            display: none;
            color: #ffd6d6;
            font-size: 14px;
            margin-top: 15px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <img
            class="logo"
            src="nsu-org.jpeg"
            alt="North South University Logo"
        >

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Enter your NSU credentials to continue
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="nsuId">NSU ID Number</label>
                <input
                    type="text"
                    id="nsuId"
                    placeholder="Enter your NSU ID"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

            <p class="error" id="errorMessage">
                Incorrect ID or password.
            </p>

        </form>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const id = document.getElementById("nsuId").value;
            const password = document.getElementById("password").value;

            /*
             * Temporary login credentials.
             * We will change these later.
             */

            const correctId = "2622992042";
            const correctPassword = "26072007";;

            if (id === correctId && password === correctPassword) {
                window.location.href = "result.html";
            } else {
                document.getElementById("errorMessage").style.display = "block";
            }
        });
    </script>

</body>
</html>
